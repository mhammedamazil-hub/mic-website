<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#080C14"/>
    </linearGradient>
    <linearGradient id="micGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="108" fill="none" stroke="#1E293B" stroke-width="3"/>
  
  <!-- Ambient Audio Aura -->
  <circle cx="256" cy="210" r="160" fill="#10B981" fill-opacity="0.08" filter="url(#glow)"/>
  
  <!-- Sound Wave Arcs -->
  <path d="M 120 180 A 150 150 0 0 0 120 280" fill="none" stroke="#06B6D4" stroke-width="12" stroke-linecap="round" opacity="0.6"/>
  <path d="M 80 150 A 200 200 0 0 0 80 310" fill="none" stroke="#10B981" stroke-width="10" stroke-linecap="round" opacity="0.4"/>
  
  <path d="M 392 180 A 150 150 0 0 1 392 280" fill="none" stroke="#06B6D4" stroke-width="12" stroke-linecap="round" opacity="0.6"/>
  <path d="M 432 150 A 200 200 0 0 1 432 310" fill="none" stroke="#10B981" stroke-width="10" stroke-linecap="round" opacity="0.4"/>
  
  <!-- Microphone Capsule -->
  <rect x="208" y="100" width="96" height="170" rx="48" fill="url(#micGrad)" filter="url(#glow)"/>
  
  <!-- Capsule Grill Texture -->
  <line x1="218" y1="140" x2="294" y2="140" stroke="#047857" stroke-width="3" stroke-linecap="round"/>
  <line x1="214" y1="160" x2="298" y2="160" stroke="#047857" stroke-width="3" stroke-linecap="round"/>
  <line x1="214" y1="180" x2="298" y2="180" stroke="#047857" stroke-width="3" stroke-linecap="round"/>
  <line x1="218" y1="200" x2="294" y2="200" stroke="#047857" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Capsule Indicator LED -->
  <circle cx="256" cy="235" r="7" fill="#E2E8F0"/>
  <circle cx="256" cy="235" r="4" fill="#06B6D4"/>
  
  <!-- Cradle Arc -->
  <path d="M 176 210 C 176 295 336 295 336 210" fill="none" stroke="#F1F5F9" stroke-width="20" stroke-linecap="round"/>
  
  <!-- Stand Stem -->
  <line x1="256" y1="295" x2="256" y2="390" stroke="#F1F5F9" stroke-width="20" stroke-linecap="round"/>
  
  <!-- Stand Base -->
  <line x1="180" y1="390" x2="332" y2="390" stroke="#F1F5F9" stroke-width="20" stroke-linecap="round"/>
</svg>
